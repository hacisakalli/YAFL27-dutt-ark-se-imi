<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mezuniyet Şarkı Oylaması</title><link rel="stylesheet" href="style.css"></head>
<body><div class="topbar"><div class="topbar-inner"><div><div class="brand">🎓 Mezuniyet Şarkı Oylaması</div><div class="muted small">Şarkılara oy ver, sonuçları gör.</div></div><div id="userBox" class="controls hidden"><span id="codeBadge" class="pill"></span><button id="logoutBtn">Kod değiştir</button></div></div></div>
<main class="container"><section id="loginCard" class="card login-card"><h2>Kodunla giriş yap</h2><p class="muted">Sana verilen kişisel kodu yaz.</p><input id="codeInput" placeholder="Örn: MEZ-ABC123"><div style="height:10px"></div><button id="loginBtn" class="primary">Devam et</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><div class="card"><div class="controls"><button id="sortScore" class="primary">🔥 Puan</button><button id="sortOriginal">📋 İlk sıra</button><button id="refreshBtn">↻ Yenile</button></div><div class="muted"><span id="songCount">0</span> şarkı</div><div id="globalMsg"></div></div><div id="songList" class="card" style="padding:0"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></body></html>
