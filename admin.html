<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yönetim</title><link rel="stylesheet" href="style.css"></head><body>
<div class="topbar"><div class="topbar-inner"><div class="brand">🛠️ Mezuniyet Oylaması — Yönetim</div><div class="controls"><a href="index.html"><button>Öğrenci sayfası</button></a><button id="logoutBtn" class="hidden">Çıkış</button></div></div></div>
<main class="container"><section id="adminLogin" class="card login-card"><h2>Yönetici girişi</h2><input id="email" type="email" placeholder="E-posta"><div style="height:8px"></div><input id="password" type="password" placeholder="Şifre"><div style="height:10px"></div><button id="loginBtn" class="primary">Giriş yap</button><div id="loginMsg"></div></section>
<section id="panel" class="hidden"><div id="adminMsg"></div><div class="grid2"><div class="card"><h2>🎵 Şarkı listesini değiştir</h2><p class="muted">Yeni CSV yüklenince eski şarkılar ve oylar silinir; öğrenci kodları kalır.</p><input id="csvFile" type="file" accept=".csv,text/csv"><div style="height:10px"></div><button id="replaceSongsBtn" class="primary">CSV ile listeyi değiştir</button></div><div class="card"><h2>🗳️ Oylar</h2><button id="resetVotesBtn" class="danger">Tüm oyları sıfırla</button></div></div>
<div class="grid2"><div class="card"><h2>🔑 Yeni öğrenci kodu</h2><input id="singleCode" placeholder="Örn: MEZ-ALP-01"><div style="height:8px"></div><button id="addCodeBtn">Kodu ekle</button></div><div class="card"><h2>🔑 Birden çok kod</h2><textarea id="bulkCodes" placeholder="Her satıra bir kod"></textarea><button id="addBulkBtn">Kodları ekle</button></div></div>
<div class="card"><div class="controls"><h2>Mevcut kodlar</h2><button id="refreshCodesBtn">↻ Yenile</button></div><div id="codesWrap"></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
